apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secops-dev

resources:
  - ../../base

patches:
  # Dev: minimal resources, single replica for testing
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: sample-app
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: sample-app
