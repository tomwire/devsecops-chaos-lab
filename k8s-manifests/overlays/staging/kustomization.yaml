apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secops-staging

resources:
  - ../../base

patches:
  # Staging: 2 replicas, moderate resources
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: sample-app
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: sample-app
